name: Build APK

on:
  push:
    branches: [main, claude/mobile-executables-vit3r1]
    paths:
      - 'study_reminder_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study_reminder_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: study-reminder-apk
          path: study_reminder_app/build/app/outputs/flutter-apk/app-release.apk
